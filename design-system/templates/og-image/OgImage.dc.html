<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="OG / social image" description="1200×630 share card — Void bg, headline slot, logo bottom-left" -->
<helmet><script src="./ds-base.js"></script><script src="./image-slot.js"></script><style>body{margin:0;background:#1C1C24}</style></helmet>
<div style="display:flex;flex-direction:column;gap:40px;padding:40px;align-items:flex-start">
<div data-screen-label="OG launch" style="position:relative;width:1200px;height:630px;overflow:hidden;background:#0A0A0F;color:#F5F5F7;font-family:'Space Grotesk',sans-serif;flex-shrink:0">
<div style="position:absolute;right:0;top:0;width:520px;height:630px"><image-slot id="og-launch-photo" shape="rect" placeholder="Venue / artist photo"></image-slot></div>
<div style="position:absolute;right:0;top:0;width:520px;height:630px;background:linear-gradient(90deg,#0A0A0F 0%,rgba(10,10,15,0) 45%);pointer-events:none"></div>
<div style="position:absolute;inset:0;background:linear-gradient(135deg,#FF3D5A 0%,#7C5CFF 100%);opacity:.16;pointer-events:none"></div>
<div style="position:absolute;left:72px;top:56px;right:480px;bottom:150px;display:flex;flex-direction:column;gap:20px;overflow:hidden">
<span style="align-self:flex-start;background:#FF3D5A;color:#0A0A0F;font-size:20px;font-weight:700;padding:8px 14px;border-radius:8px">{{ eyebrow }}</span>
<h1 style="margin:0;font-size:68px;line-height:.98;font-weight:700;letter-spacing:-0.045em;text-wrap:balance">{{ headline }}</h1>
<p style="margin:0;font-size:24px;line-height:1.35;color:#C4C4CE;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">{{ subline }}</p>
</div>
<div style="position:absolute;left:72px;bottom:64px"><x-import component-from-global-scope="BumpDesignSystem_4e5c17.Logo" height="{{ 52 }}" hint-size="166px,52px"></x-import></div>
</div>
<div data-screen-label="OG brand" style="position:relative;width:1200px;height:630px;overflow:hidden;background:#0A0A0F;color:#F5F5F7;font-family:'Space Grotesk',sans-serif;flex-shrink:0">
<div style="position:absolute;inset:0;background-image:radial-gradient(circle,#2E2E3A 1.4px,transparent 1.8px);background-size:18px 18px;-webkit-mask-image:linear-gradient(0deg,#000,transparent 70%);mask-image:linear-gradient(0deg,#000,transparent 70%)"></div>
<div style="position:absolute;left:72px;top:96px;right:72px;display:flex;flex-direction:column;gap:20px">
<h1 style="margin:0;font-size:120px;line-height:.92;font-weight:700;letter-spacing:-0.05em">100% theirs.<br><span style="color:#FF3D5A">All yours.</span></h1>
<p style="margin:0;font-size:28px;color:#9A9AA8">Artists keep every cent of their music sales.</p>
</div>
<div style="position:absolute;left:72px;bottom:64px"><x-import component-from-global-scope="BumpDesignSystem_4e5c17.Logo" height="{{ 52 }}" hint-size="166px,52px"></x-import></div>
<div style="position:absolute;right:72px;bottom:72px;font-family:'Space Mono',monospace;font-size:20px;color:#6B6B7A">bump.fm</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;eyebrow&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Fri, Nov 27 · Philadelphia&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;headline&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Bump launches at the Black Friday Marketplace.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;subline&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Stream free. Artists keep 100% of every sale. KANVAS Venue, 3870 Lancaster Ave.&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      eyebrow: this.props.eyebrow ?? 'Fri, Nov 27 · Philadelphia',
      headline: this.props.headline ?? 'Bump launches at the Black Friday Marketplace.',
      subline: this.props.subline ?? 'Stream free. Artists keep 100% of every sale. KANVAS Venue, 3870 Lancaster Ave.'
    };
  }
}
</script>
</body>
</html>
