<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px}.sw{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}.chip{height:64px;border-radius:12px;border:1px solid rgba(255,255,255,.06)}.n{font:600 13px/1.2 var(--font-body);color:var(--text-primary)}.h{font:400 11px/1.2 var(--font-mono);color:var(--text-secondary)}.row{display:flex;gap:12px}.lbl{font:600 11px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary)}</style></head><body><div class="row" style="gap:32px;align-items:center"><span style="font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-secondary)">Track title</span><span style="font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-tertiary)">Or with email</span><span style="font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--accent)">Now playing</span></div></body></html>
