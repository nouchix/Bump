<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px}.sw{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}.chip{height:64px;border-radius:12px;border:1px solid rgba(255,255,255,.06)}.n{font:600 13px/1.2 var(--font-body);color:var(--text-primary)}.h{font:400 11px/1.2 var(--font-mono);color:var(--text-secondary)}.row{display:flex;gap:12px}.lbl{font:600 11px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary)}</style></head><body><div class="row" style="gap:18px"><div class="sw" style="align-items:center"><div style="width:72px;height:72px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-xs)"></div><span class="h">xs · 6</span></div><div class="sw" style="align-items:center"><div style="width:72px;height:72px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-sm)"></div><span class="h">sm · 8</span></div><div class="sw" style="align-items:center"><div style="width:72px;height:72px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-md)"></div><span class="h">md · 12</span></div><div class="sw" style="align-items:center"><div style="width:72px;height:72px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-lg)"></div><span class="h">lg · 16</span></div><div class="sw" style="align-items:center"><div style="width:72px;height:72px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-xl)"></div><span class="h">xl · 24</span></div><div class="sw" style="align-items:center"><div style="width:72px;height:72px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-pill)"></div><span class="h">pill · 999</span></div></div></body></html>
