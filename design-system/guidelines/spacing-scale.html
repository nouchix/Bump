ackground:var(--accent);border-radius:3px"></div><span class="h">32</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-10);height:var(--space-10);background:var(--accent);border-radius:3px"></div><span class="h">40</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-12);height:var(--space-12);background:var(--accent);border-radius:3px"></div><span class="h">48</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-16);height:var(--space-16);background:var(--accent);border-radius:3px"></div><span class="h">64</span></div></div></body></html>
