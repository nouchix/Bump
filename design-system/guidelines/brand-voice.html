<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px}.sw{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}.chip{height:64px;border-radius:12px;border:1px solid rgba(255,255,255,.06)}.n{font:600 13px/1.2 var(--font-body);color:var(--text-primary)}.h{font:400 11px/1.2 var(--font-mono);color:var(--text-secondary)}.row{display:flex;gap:12px}.lbl{font:600 11px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary)}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px"><div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px"><span class="lbl">Upload complete</span><span style="font:700 20px/1.2 var(--font-display);letter-spacing:-.02em">It's live. Go tell people.</span></div><div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px"><span class="lbl">First sale</span><span style="font:700 20px/1.2 var(--font-display);letter-spacing:-.02em">Someone just paid you directly.</span></div><div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px"><span class="lbl">Empty dashboard</span><span style="font:700 20px/1.2 var(--font-display);letter-spacing:-.02em">Nothing yet. Fix that?</span></div></div><div class="row" style="margin-top:14px;gap:24px;font-size:12px;color:var(--text-secondary)"><span>✓ you, not we</span><span>✓ sentence case</span><span>✗ exclamation spam</span><span>✗ “monetization levers”</span></div></body></html>
