rder-radius:4px;background:var(--accent-2);transform-origin:bottom;animation:bump-eq 1.26s cubic-bezier(.45,0,.55,1) 0.15s infinite"></span><span style="width:4px;height:100%;border-radius:4px;background:var(--accent-2);transform-origin:bottom;animation:bump-eq 0.9s cubic-bezier(.45,0,.55,1) 0.5s infinite"></span><span style="width:4px;height:100%;border-radius:4px;background:var(--accent-2);transform-origin:bottom;animation:bump-eq 1.08s cubic-bezier(.45,0,.55,1) 0.25s infinite"></span></div><div style="display:flex;gap:4px;align-items:flex-end;height:16px"><span style="width:2px;height:100%;border-radius:4px;background:var(--text-secondary);transform-origin:bottom;animation:bump-eq 0.9s cubic-bezier(.45,0,.55,1) 0s infinite"></span><span style="width:2px;height:100%;border-radius:4px;background:var(--text-secondary);transform-origin:bottom;animation:bump-eq 1.08s cubic-bezier(.45,0,.55,1) 0.35s infinite"></span><span style="width:2px;height:100%;border-radius:4px;background:var(--text-secondary);transform-origin:bottom;animation:bump-eq 1.26s cubic-bezier(.45,0,.55,1) 0.15s infinite"></span><span style="width:2px;height:100%;border-radius:4px;background:var(--text-secondary);transform-origin:bottom;animation:bump-eq 0.9s cubic-bezier(.45,0,.55,1) 0.5s infinite"></span><span style="width:2px;height:100%;border-radius:4px;background:var(--text-secondary);transform-origin:bottom;animation:bump-eq 1.08s cubic-bezier(.45,0,.55,1) 0.25s infinite"></span></div></div></body></html>
