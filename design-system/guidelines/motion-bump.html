<!-- @dsCard group="Motion" viewport="700x170" name="The Bump" subtitle="Press: 96% then spring back · 180ms" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px}.sw{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}.chip{height:64px;border-radius:12px;border:1px solid rgba(255,255,255,.06)}.n{font:600 13px/1.2 var(--font-body);color:var(--text-primary)}.h{font:400 11px/1.2 var(--font-mono);color:var(--text-secondary)}.row{display:flex;gap:12px}.lbl{font:600 11px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary)}.b{height:56px;padding:0 28px;border:0;border-radius:var(--radius-md);background:var(--accent);color:#fff;font:700 16px var(--font-body);cursor:pointer;transition:transform var(--duration-bump) var(--ease-bump),background var(--duration-fast) var(--ease-out-expo)}.b:hover{background:var(--accent-hover)}.b:active{transform:scale(var(--bump-scale))}</style></head><body><div class="row" style="gap:24px;align-items:center"><button class="b">Press me</button><div style="display:flex;flex-direction:column;gap:6px"><span class="h">transform: scale(.96)</span><span class="h">--ease-bump: cubic-bezier(0.34, 1.56, 0.64, 1)</span><span class="h">--duration-bump: 180ms</span><span class="h">--ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1)</span></div></div></body></html>
