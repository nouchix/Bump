<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px}.sw{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}.chip{height:64px;border-radius:12px;border:1px solid rgba(255,255,255,.06)}.n{font:600 13px/1.2 var(--font-body);color:var(--text-primary)}.h{font:400 11px/1.2 var(--font-mono);color:var(--text-secondary)}.row{display:flex;gap:12px}.lbl{font:600 11px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary)}body{background:var(--ink-900)}</style></head><body><div class="row" style="gap:20px;padding:8px"><div class="sw" style="align-items:center"><div style="width:96px;height:80px;border-radius:16px;background:var(--surface-card);box-shadow:var(--shadow-sm)"></div><span class="h">sm</span></div><div class="sw" style="align-items:center"><div style="width:96px;height:80px;border-radius:16px;background:var(--surface-card);box-shadow:var(--shadow-md)"></div><span class="h">md</span></div><div class="sw" style="align-items:center"><div style="width:96px;height:80px;border-radius:16px;background:var(--surface-card);box-shadow:var(--shadow-lg)"></div><span class="h">lg</span></div><div class="sw" style="align-items:center"><div style="width:96px;height:80px;border-radius:16px;background:var(--surface-card);box-shadow:var(--shadow-glow-signal)"></div><span class="h">glow signal</span></div><div class="sw" style="align-items:center"><div style="width:96px;height:80px;border-radius:16px;background:var(--surface-card);box-shadow:var(--shadow-glow-pulse)"></div><span class="h">glow pulse</span></div></div></body></html>
