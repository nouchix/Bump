<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px}.sw{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}.chip{height:64px;border-radius:12px;border:1px solid rgba(255,255,255,.06)}.n{font:600 13px/1.2 var(--font-body);color:var(--text-primary)}.h{font:400 11px/1.2 var(--font-mono);color:var(--text-secondary)}.row{display:flex;gap:12px}.lbl{font:600 11px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary)}</style></head><body><div class="row" style="gap:16px"><div style="flex:1;display:flex;flex-direction:column;gap:8px"><div style="display:flex;align-items:center;gap:10px"><span style="width:28px;height:28px;border-radius:8px;background:var(--bg-app);border:1px solid var(--border-default)"></span><span class="h">--bg-app</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:28px;height:28px;border-radius:8px;background:var(--surface-card);border:1px solid var(--border-default)"></span><span class="h">--surface-card</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:28px;height:28px;border-radius:8px;background:var(--surface-raised);border:1px solid var(--border-default)"></span><span class="h">--surface-raised</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:28px;height:28px;border-radius:8px;background:var(--surface-sunken);border:1px solid var(--border-default)"></span><span class="h">--surface-sunken</span></div></div><div style="flex:1;display:flex;flex-direction:column;gap:8px"><div style="display:flex;align-items:center;gap:10px"><span style="width:28px;height:28px;border-radius:8px;border:2px solid var(--border-subtle);background:transparent"></span><span class="h">--border-subtle</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:28px;height:28px;border-radius:8px;border:2px solid var(--border-default);background:transparent"></span><span class="h">--border-default</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:28px;height:28px;border-radius:8px;border:2px solid var(--border-strong);background:transparent"></span><span class="h">--border-strong</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:28px;height:28px;border-radius:8px;border:2px solid var(--accent-soft);background:var(--accent-soft)"></span><span class="h">--accent-soft</span></div></div><div style="flex:1;display:flex;flex-direction:column;gap:8px;font-size:15px;font-weight:600"><span style="color:var(--text-primary)">text-primary</span><span style="color:var(--text-secondary)">text-secondary</span><span style="color:var(--text-tertiary)">text-tertiary</span><span style="color:var(--accent)">accent</span></div></div></body></html>
