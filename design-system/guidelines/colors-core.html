<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px}.sw{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}.chip{height:64px;border-radius:12px;border:1px solid rgba(255,255,255,.06)}.n{font:600 13px/1.2 var(--font-body);color:var(--text-primary)}.h{font:400 11px/1.2 var(--font-mono);color:var(--text-secondary)}.row{display:flex;gap:12px}.lbl{font:600 11px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--bump-void);height:64px"></div><div class="n">Void</div><div class="h">#0A0A0F</div></div><div class="sw"><div class="chip" style="background:var(--bump-grille);height:64px"></div><div class="n">Grille</div><div class="h">#1C1C24</div></div><div class="sw"><div class="chip" style="background:var(--bump-signal);height:64px"></div><div class="n">Signal</div><div class="h">#FF3D5A</div></div><div class="sw"><div class="chip" style="background:var(--bump-pulse);height:64px"></div><div class="n">Pulse</div><div class="h">#7C5CFF</div></div><div class="sw"><div class="chip" style="background:var(--bump-static);height:64px"></div><div class="n">Static</div><div class="h">#F5F5F7</div></div></div></body></html>
